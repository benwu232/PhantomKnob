name: PhantomKnob
options:
  bundleIdPrefix: com.phantomknob
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: PhantomKnob
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_PREVIEWS: YES

packages:
  sentry-cocoa:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.5.0"
  TelemetryClient:
    url: https://github.com/TelemetryDeck/SwiftClient
    from: "1.0.0"

targets:
  PhantomKnob:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
      - path: Model
        excludes:
          - "**/.DS_Store"
      - path: ViewModel
        excludes:
          - "**/.DS_Store"
      - path: View
        excludes:
          - "**/.DS_Store"
      - path: Service
        excludes:
          - "**/.DS_Store"
      - path: Control
        excludes:
          - "**/.DS_Store"
      - path: Storage
        excludes:
          - "**/.DS_Store"
      - path: Assets.xcassets
      - path: Resources
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.phantomknob.PhantomKnob
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: PhantomKnob.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: sentry-cocoa
        product: Sentry
      - package: Sparkle
        product: Sparkle
      - package: TelemetryClient
        product: TelemetryClient
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PhantomKnob
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2025 Ben Wu. All rights reserved."
        LSUIElement: true
        SUFeedURL: "https://phantomknob.com/appcast.xml"
        SUPublicEDKey: "PLACEHOLDER_PUBLIC_KEY"
        SUEnableAutomaticChecks: true

  PhantomKnobTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PhantomKnobTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: PhantomKnob
    settings:
      base:
        PRODUCT_NAME: PhantomKnobTests
        PRODUCT_BUNDLE_IDENTIFIER: com.phantomknob.PhantomKnobTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
